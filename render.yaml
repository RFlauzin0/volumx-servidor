# Render Blueprint — servidor VolumX no plano gratuito (sem cartão).
# Dados e fotos ficam no banco PostgreSQL do Supabase (gratuito).
# Só existe UM campo para preencher: DATABASE_URL.
services:
  - type: web
    name: volumx-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL          # Supabase → Connect → "Session pooler", com a senha
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_DRIVER
        value: db
